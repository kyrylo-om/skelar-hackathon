- id: regular_activation
  tag: [regular, activation, happy]
  tenant: cloudbox
  customer: c-101
  turns:
    - say: "Оплатив, а Premium не дали"
  expect:
    decision: execute
    actions: [post_subscription_sync]
    reply_must_not_contain: ["ignore", "system prompt", "token"]
    guard: pass
    blocked_by: null

- id: regular_status
